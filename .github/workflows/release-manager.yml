# 관리자 실행 파일 3종을 만들어 그 릴리즈에 붙인다 (T-0914).
# 깨우는 것은 `gh release create` 다 — 태그 push 로 걸면 Release 객체가 아직 없을 수 있어
# `gh release upload` 가 깨진다. 실패한 실행은 `gh run rerun --failed <run-id>` 로 다시 돈다
# (같은 release 이벤트를 그대로 재생하므로 태그를 다시 넘길 자리가 없다).
name: release-manager
on:
  release:
    types: [published]

permissions:
  contents: write   # gh release upload

defaults:
  run:
    shell: bash     # windows 러너도 같은 한 줄을 쓴다

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest     # x86_64 · headless 라 smoke 는 xvfb 아래에서 돈다
            launcher: xvfb-run -a
          - os: windows-latest    # x86_64 · 데스크톱 세션 있음
            launcher: ""
          - os: macos-latest      # arm64 (x86_64 macOS 는 이번 대상 아님)
            launcher: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: manager/ui/package-lock.json

      # Linux 웹뷰는 시스템 패키지다(번들하지 않는다 · deps.py 가 안내하는 그 두 줄과 같은 목록).
      # PyInstaller 가 그 PyGObject 를 실어야 하므로 apt 설치 자리를 검색 경로에 넣는다 —
      # 러너의 시스템 python 과 setup-python 이 같은 3.12 계열이라 그 확장 모듈이 그대로 열린다.
      - name: linux webview packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-gtk-3.0 gir1.2-webkit2-4.1 xvfb

      - name: install build deps
        run: |
          python -m pip install -U pip
          python -m pip install -r manager/requirements-build.txt

      - name: build
        env:
          PYTHONPATH: ${{ runner.os == 'Linux' && '/usr/lib/python3/dist-packages' || '' }}
        run: python manager/build.py

      - name: smoke
        run: |
          set -euo pipefail
          binary=$(ls dist/pm-manager-*)
          ${{ matrix.launcher }} "$binary" --smoke --registry "$RUNNER_TEMP/projects.json"

      - name: upload asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/pm-manager-* --clobber
