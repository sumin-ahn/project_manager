[pytest]
# An unregistered marker (a typo'd / renamed release marker, etc.) becomes a
# collection ERROR instead of a silent deselect — guards the marker-rename risk
# class (T-0159). We use filterwarnings (not `addopts = --strict-markers`)
# because in pytest 9.x `--strict-markers` placed in addopts is a NO-OP for
# enforcement (it only warns; the flag enforces only on the literal command
# line). filterwarnings reliably escalates from the ini. -m <expr> selection
# syntax is unaffected; registered markers below never warn, so never error.
filterwarnings =
    error::pytest.PytestUnknownMarkWarning
# Live (real-LLM) test marker — subset isolation for the single live release gate
# (ADR-0039 D1: the 2-tier shipping/release live design is consolidated into one
# `release` tier). Default skip stays via the per-test PM_ORCH_LIVE_RELEASE +
# shutil.which(...) skipif; this marker only lets a runner select the live subset
# (e.g. `pytest -m release`) without firing every test.
markers =
    release: 릴리즈 테스트 — user-triggered release dogfood (real LLM · full wave · PM_ORCH_LIVE_RELEASE).
    integration: 권한 있는 환경의 실제 외부 바이너리/loopback 통합 테스트 (기본 회귀에도 capability 있을 때 실행).
# 임시물 보관 — 임시 루트가 프로젝트 안(루트 conftest.py 의 PYTEST_DEBUG_TEMPROOT)이므로 회귀
# 마다 쌓이면 저장소가 커진다. 진단에 쓰이는 것은 실패분뿐이고, 그것도 직전 1회분이면 된다.
tmp_path_retention_policy = failed
tmp_path_retention_count = 1
