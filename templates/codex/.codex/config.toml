# templates/codex/.codex/config.toml — codex 어댑터 대화형 ctx 가드 (instance-owned).
# 이 파일은 trusted project 로 승인된 뒤에만 로드된다(codex trust 모델·실측). manifest 미등록 =
# 채택자 소유 노브(pm_update 미전파 — settings.json/opencode.jsonc 대칭·hook trust 재승인 churn 회피).
# 반입 가능 키(실측): model·sandbox/approval·features·hooks·model_context_window·model_auto_compact_token_limit.
# machine-local 키(model_provider*·profile/profiles·notify·otel)는 로드 시 무시되므로 기재하지 않는다.

# Claude settings.json 의 일상 작업 allowlist에 대응하는 Codex 기본 권한.
# workspace 내부 파일 생성·편집·일반 명령은 바로 실행하고, sandbox 밖 요청은 자동 reviewer가
# 위험도를 판정한다. 삭제·force push·hard reset 등은 .codex/rules/default.rules가 별도 차단한다.
sandbox_mode = "workspace-write"
approval_policy = "on-request"
approvals_reviewer = "auto_review"

# 압축 지점: 독립 모델 한도 C와 사용자 희망 기준 W에서 해소한 E=min(W,C)를 사용한다.
#   model_auto_compact_token_limit = floor(E × ctx.compact_at_pct / 100).
#   엔진 최상위 model_context_window override는 두지 않는다. 사용자 global/profile은 보존한다.
#   metadata가 unknown이면 `pm-config apply`가 쓰기를 거부한다. 아래 숫자는 기존 출하 seed이며 actual C의 근거가 아니다.
#   hooks.json PreCompact는 compaction을 통과시키고 직전 내구 경계 이후의 checkpoint 기록을 안내한다.
model_auto_compact_token_limit = 180000

[features]
multi_agent = true    # .codex/agents/*.toml in-session spawn (stable·기본 on·명시)
hooks = true          # 비차단 PreCompact checkpoint 안내 발화 전제

[sandbox_workspace_write]
# 대화형 PM의 기본값이다. on-request 승인 정책에서 네트워크 명령의 승격을 요청한다.
# pm_delegate의 승인 없는 CLI 실행은 건별 승격을 요청할 수 없으므로 실행별 override로 네트워크를 허용한다.
network_access = false
