# templates/codex/.codex/config.toml — codex 어댑터 대화형 ctx 가드 (instance-owned).
# 이 파일은 trusted project 로 승인된 뒤에만 로드된다(codex trust 모델·실측). manifest 미등록 =
# 채택자 소유 노브(pm_update 미전파 — settings.json/opencode.jsonc 대칭·hook trust 재승인 churn 회피).
# 반입 가능 키(실측): model·sandbox/approval·features·hooks·model_auto_compact_token_limit.
# machine-local 키(model_provider*·profile/profiles·notify·otel)는 로드 시 무시되므로 기재하지 않는다.

# Claude settings.json 의 일상 작업 allowlist에 대응하는 Codex 기본 권한.
# workspace 내부 파일 생성·편집·일반 명령은 바로 실행하고, sandbox 밖 요청은 자동 reviewer가
# 위험도를 판정한다. 삭제·force push·hard reset 등은 .codex/rules/default.rules가 별도 차단한다.
sandbox_mode = "workspace-write"
approval_policy = "on-request"
approvals_reviewer = "auto_review"

# 대화형 경로: 문서화된 숫자 threshold만 설정한다. 이 값은 auto-compaction을 끄지 않으며,
#   off sentinel을 발명하지 않는다. threshold 도달 시 hooks.json PreCompact는 compaction을
#   통과시키고 직전 내구 경계 이후 구간의 checkpoint 기록을 안내한다.
model_auto_compact_token_limit = 900000

[features]
multi_agent = true    # .codex/agents/*.toml in-session spawn (stable·기본 on·명시)
hooks = true          # 비차단 PreCompact checkpoint 안내 발화 전제

[sandbox_workspace_write]
# egress 차단 안전 경계. cross-harness 실위임은 전역 true로 완화하지 않고,
# $pm-dev-delegate 카드의 dry-run → exec_command require_escalated 건별 승격 계약을 탄다.
# 최초 pm_delegate.py reusable prefix 승인이 그 승격의 근거다 —
# local.conf delegate.enabled 는 위임 허용 여부만 정하고 승격을 대신하지 않는다.
network_access = false
